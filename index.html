<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careai — Care Management Platform</title>
<style>
/* ============ Careai Prototype — Design tokens ============ */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#EBF3F1;
  --ink:#122F38; --body:#2C4348; --muted:#54696E;
  --line:#D7E1DF; --line2:#C4D3D0;
  --teal:#136B60; --teal-strong:#0E3A46; --teal-soft:#DDEDEA;
  --aqua:#9CCFC9; --wash:#E7F1EF;
  --amber:#8F5D0B; --amber-bg:#FCF0DA; --amber-line:#E4C88F;
  --red:#A93226; --red-bg:#FAE8E5; --red-line:#E7B7B0;
  --green:#1E6B3A; --green-bg:#E2F2E7;
  --shadow:0 1px 3px rgba(14,58,70,.08),0 4px 14px rgba(14,58,70,.06);
  --radius:12px;
}
[data-theme="dark"]{
  --bg:#0B242C; --surface:#12363F; --surface2:#0F2E37;
  --ink:#F1F6F5; --body:#D8E4E2; --muted:#A3BAB8;
  --line:#265460; --line2:#31626F;
  --teal:#63BCB0; --teal-strong:#9CCFC9; --teal-soft:#174751;
  --aqua:#9CCFC9; --wash:#153F4A;
  --amber:#EFC077; --amber-bg:#3D2F10; --amber-line:#6B5424;
  --red:#F09A8D; --red-bg:#4A211B; --red-line:#7A392F;
  --green:#8FD3A6; --green-bg:#1B3F2A;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--body);line-height:1.55}
h1,h2,h3,.display{font-family:Cambria,Georgia,"Times New Roman",serif;color:var(--ink);line-height:1.25}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.06rem;font-weight:700}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:18px;height:18px}
.icon.lg{width:26px;height:26px}

/* ============ Layout ============ */
#app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px}
.brand .iso{width:38px;height:35px;flex:none}
.brand .name{font-family:Cambria,Georgia,serif;font-size:1.5rem;color:var(--ink)}
.brand .name b{font-weight:700;color:var(--teal);font-style:italic}
.plan-chip{margin:0 18px 14px;padding:8px 12px;background:var(--wash);border-radius:8px;font-size:.82rem;color:var(--muted);line-height:1.35}
.plan-chip strong{display:block;color:var(--ink);font-size:.9rem}
nav.menu{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:10px;color:var(--body);font-size:1rem;font-weight:600;min-height:48px}
.menu a:hover{background:var(--wash);text-decoration:none}
.menu a.active{background:var(--teal-soft);color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
[data-theme="dark"] .menu a.active{color:var(--teal-strong)}
.menu a .badge{margin-left:auto}
.sidebar .foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);line-height:1.4}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar .search{flex:1;max-width:430px;position:relative}
.topbar .search input{width:100%;padding:11px 14px 11px 42px;border:1.5px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem;min-height:46px}
.topbar .search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:60;overflow:hidden}
.search-results a{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;color:var(--body);border-bottom:1px solid var(--line)}
.search-results a:last-child{border-bottom:none}
.search-results a:hover{background:var(--wash);text-decoration:none}
.topbar .spacer{flex:1}
.userbox{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex:none}
[data-theme="dark"] .avatar{color:#0B242C}
.userbox .who{line-height:1.2}
.userbox .who .nm{font-weight:700;color:var(--ink);font-size:.92rem}
.userbox .who .rl{font-size:.78rem;color:var(--muted)}
.userbox select{border:none;background:transparent;font-size:.9rem;color:var(--teal);font-weight:600;cursor:pointer;max-width:170px}
.content{padding:26px;max-width:1340px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px;font-size:.98rem;max-width:70ch}
.page-head .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

/* ============ Components ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-weight:700;font-size:.95rem;min-height:46px}
[data-theme="dark"] .btn{color:#0B242C}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--surface);color:var(--teal);border-color:var(--teal)}
.btn.ghost{background:transparent;color:var(--body);border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.small{padding:6px 12px;min-height:38px;font-size:.88rem}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);color:var(--body)}
.iconbtn:hover{background:var(--wash)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .card-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card .card-head h2,.card .card-head h3{flex:1}
.card .card-body{padding:20px}
.grid{display:grid;gap:18px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}.sidebar{display:none}}
.stat{padding:18px 20px}
.stat .num{font-family:Cambria,Georgia,serif;font-size:2.1rem;color:var(--ink);line-height:1.1}
.stat .num.warn{color:var(--amber)}
.stat .num.crit{color:var(--red)}
.stat .num.ok{color:var(--teal)}
.stat .lbl{font-size:.9rem;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.badge.high{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.badge.medium{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.badge.low{background:var(--teal-soft);color:var(--teal);border:1px solid var(--line2)}
.badge.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--line)}
.badge.count{background:var(--red);color:#fff;border:none;min-width:26px;justify-content:center;padding:3px 8px}
[data-theme="dark"] .badge.count{color:#0B242C}
table.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;padding:12px 14px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--wash)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;color:var(--ink);font-size:.9rem;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:.98rem;min-height:46px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.modal-back{position:fixed;inset:0;background:rgba(9,30,37,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:640px;border:1px solid var(--line)}
.modal .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal .modal-head h2{flex:1}
.modal .modal-body{padding:22px}
.modal .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--teal-strong);color:#F1F6F5;padding:13px 22px;border-radius:10px;box-shadow:var(--shadow);z-index:200;font-weight:600;display:flex;gap:10px;align-items:center}
[data-theme="dark"] .toast{background:#E7F1EF;color:#0E3A46}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty .icon{width:34px;height:34px;margin:0 auto 8px;display:block;color:var(--line2)}

/* alerts */
.alert-item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.alert-item .dot{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.alert-item .dot.critical{background:var(--red-bg);color:var(--red)}
.alert-item .dot.high{background:var(--amber-bg);color:var(--amber)}
.alert-item .dot.medium{background:var(--teal-soft);color:var(--teal)}
.alert-item .body{flex:1;min-width:0}
.alert-item .t{font-weight:700;color:var(--ink);font-size:1rem}
.alert-item .d{font-size:.92rem;color:var(--body);margin-top:2px}
.alert-item .m{font-size:.82rem;color:var(--muted);margin-top:4px}
.alert-item .act{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.alert-item.compact .act{flex-direction:column;align-items:stretch;max-width:200px}
.alert-item.compact .act .btn{justify-content:center}
.alert-item.done{opacity:.62}

/* member header */
.member-hero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.member-hero .avatar{width:58px;height:58px;font-size:1.25rem}
.member-hero .meta{font-size:.95rem;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:20px 0;flex-wrap:wrap}
.tabs a{padding:12px 18px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-size:.98rem}
.tabs a:hover{text-decoration:none;color:var(--teal)}
.tabs a.active{color:var(--teal);border-bottom-color:var(--teal)}
.kv{display:grid;grid-template-columns:minmax(150px,38%) 1fr;gap:8px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{color:var(--ink);font-weight:600}
.ai-box{background:var(--wash);border:1px solid var(--line2);border-radius:var(--radius);padding:18px 20px;position:relative}
.ai-box .tag{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.ai-box p{color:var(--body);font-size:.98rem}
.ai-note{font-size:.8rem;color:var(--muted);display:flex;gap:7px;align-items:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);color:var(--body);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;margin:0 6px 6px 0}
.chip.warn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.chip.crit{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.progress{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--teal);border-radius:999px}
.progress.warn i{background:var(--amber)}
.plan-problem{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.plan-problem .ph{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface2);flex-wrap:wrap}
.plan-problem .ph h3{flex:1;min-width:200px}
.plan-problem .pb{padding:16px 18px}
.intervention{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.intervention:last-child{border-bottom:none}
.intervention input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:var(--teal);flex:none;cursor:pointer}
.intervention .tx{flex:1;font-size:.95rem}
.intervention .tx.done{text-decoration:line-through;color:var(--muted)}
.note-item{padding:16px 20px;border-bottom:1px solid var(--line)}
.note-item:last-child{border-bottom:none}
.note-item .nh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.note-item .nh .ty{font-weight:700;color:var(--ink)}
.note-item .nh .dt{color:var(--muted);font-size:.85rem}
.note-item p{font-size:.94rem;white-space:pre-line}
.note-item textarea{width:100%;margin-top:8px;padding:12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;min-height:120px;line-height:1.5}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2.5px solid var(--surface)}
.tl-item.crit::before{background:var(--red)}
.tl-item.warn::before{background:var(--amber)}
.tl-item .td{font-size:.8rem;color:var(--muted)}
.tl-item .tt{font-weight:700;color:var(--ink);font-size:.95rem}
.tl-item .tx{font-size:.9rem}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.barrow .bl{width:180px;flex:none;font-size:.88rem;color:var(--body);font-weight:600}
.barrow .bar{flex:1;height:18px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.barrow .bar i{display:block;height:100%;background:var(--aqua)}
.barrow .bv{width:56px;flex:none;text-align:right;font-weight:700;color:var(--ink);font-size:.9rem}
.setting-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setting-row:last-child{border-bottom:none}
.setting-row .sl{flex:1;min-width:240px}
.setting-row .sl b{display:block;color:var(--ink)}
.setting-row .sl span{font-size:.86rem;color:var(--muted)}
.footer-note{margin:26px 0 10px;text-align:center;color:var(--muted);font-size:.8rem}
.footer-note b{color:var(--teal)}
@media print{.sidebar,.topbar{display:none}}
</style>
</head>

<script>
/* =================== Store & helpers =================== */
const DB_KEY = 'careai_proto_db_v3';
let DB;
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw){ DB = JSON.parse(raw); return; } }catch(e){}
  DB = seedDB(); save();
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} }
function resetDB(){ try{ localStorage.removeItem(DB_KEY); }catch(e){} DB = seedDB(); save(); }

const t = k => { const d = I18N[DB.settings.lang] || I18N.en; return k.split('.').reduce((o,p)=>o&&o[p]!==undefined?o[p]:null, d) ?? k; };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const locale = () => t('locale');
function fmtDate(isoStr){
  if(!isoStr) return '—';
  const d = new Date(isoStr + (isoStr.length===10?'T12:00:00':''));
  const today = new Date(); const y = new Date(); y.setDate(y.getDate()-1);
  if(iso(d)===iso(today)) return t('today');
  if(iso(d)===iso(y)) return t('yesterday');
  return new Intl.DateTimeFormat(locale(), {day:'numeric', month:'short', year:'numeric'}).format(d);
}
function daysUntil(isoStr){ const d = new Date(isoStr+'T12:00:00'); return Math.round((d - new Date())/(864e5)); }
const fmtNum = n => new Intl.NumberFormat(locale()).format(n);
const icon = (n, cls='') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const member = id => DB.members.find(m => m.id===id);
const currentUser = () => DB.users.find(u => u.id===DB.settings.currentUser) || DB.users[0];
const initials = n => n.split(/[\s,]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const uid = p => p + Math.random().toString(36).slice(2,8);
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const el = document.createElement('div'); el.className='toast'; el.innerHTML = icon('check','sm') + esc(msg);
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.remove(), 3200);
}
function riskBadge(r){ return `<span class="badge ${r}">${t('risk_'+r)}</span>`; }
function riskTrend(m){
  const h = (m.riskHistory||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last = h[h.length-1]||null, prev = h[h.length-2]||null;
  return {last, prev, delta: (last&&prev)? last.score-prev.score : 0, tierChanged: !!(last&&prev&&last.tier!==prev.tier)};
}
function riskArrow(delta){ return delta>0?'↑':delta<0?'↓':'→'; }
function riskScoreBadge(m){
  const tr = riskTrend(m);
  const cls = tr.delta>0?'high':tr.delta<0?'ok':'neutral';
  return `<span class="badge ${cls}" title="${tr.last?esc(tr.last.reason):''}">${t('risk_score')} ${m.riskScore} ${riskArrow(tr.delta)}${tr.delta? ' '+Math.abs(tr.delta):''}</span>` +
    (tr.last? ` <span style="font-size:.8rem;color:var(--muted)">${t('risk_updated')} ${fmtDate(tr.last.date)}${tr.tierChanged? ` · ${t('risk_tier_changed')}: ${t('risk_'+tr.prev.tier)} → ${t('risk_'+tr.last.tier)}`:''}</span>` : '');
}
function riskTrendMini(m){
  const tr = riskTrend(m);
  if(!tr.last || !tr.delta || daysUntil(tr.last.date) < -30) return '';
  return ` <span style="font-size:.8rem;font-weight:700;color:${tr.delta>0?'var(--red)':'var(--teal)'}" title="${esc(tr.last.reason)}">${riskArrow(tr.delta)}${Math.abs(tr.delta)}</span>`;
}
function alertsFor(mId){ return DB.alerts.filter(a=>a.memberId===mId && a.status==='new'); }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.theme);
  document.documentElement.style.fontSize = DB.settings.bigText ? '19px' : '17px';
  document.documentElement.lang = DB.settings.lang;
}

/* =================== AI text generators (deterministic, simulated) =================== */
function aiSummary(m){
  const en = true;
  const parts = [];
  const cond = m.conditions.join(', ');
  if(en){
    parts.push(`${m.name.split(' ')[0]} is a ${m.age}-year-old ${m.sex==='F'?'woman':'man'} living with ${cond}. Risk level: ${I18N.en['risk_'+m.risk].toLowerCase()} (score ${m.riskScore}).`);
    if(m.util.er>0) parts.push(`In the last 12 months: ${m.util.er} ER visit(s), ${m.util.ip} admission(s) and ${m.util.pcp} PCP visit(s).`);
    const unf = m.pharmacy.filter(p=>p.status==='unfilled');
    if(unf.length) parts.push(`⚠ ${unf.map(p=>p.drug.split(' ')[0]).join(', ')} overdue for refill.`);
    if(m.sdoh.length) parts.push(`Social factors to address: ${m.sdoh.map(s=>I18N.en.sdoh_labels[s].toLowerCase()).join(', ')}.`);
    if(m.gaps.length) parts.push(`Open gaps in care: ${m.gaps.map(g=>I18N.en.gap_labels[g].toLowerCase()).join('; ')}.`);
    if(m.story==='wedding') parts.push(`Personal goal that motivates her: riding the bus to her daughter’s wedding in June.`);
    if(!m.hra.done) parts.push(`Initial HRA pending — due ${fmtDate(m.hra.due)} (regulatory).`);
  } else {
    parts.push(`${m.name.split(' ')[0]} tiene ${m.age} años y vive con ${cond}. Nivel de riesgo: ${I18N.en['risk_'+m.risk].toLowerCase()} (score ${m.riskScore}).`);
    if(m.util.er>0) parts.push(`En los últimos 12 meses: ${m.util.er} visita(s) a emergencia, ${m.util.ip} internación(es) y ${m.util.pcp} visita(s) al médico de cabecera.`);
    const unf = m.pharmacy.filter(p=>p.status==='unfilled');
    if(unf.length) parts.push(`⚠ ${unf.map(p=>p.drug.split(' ')[0]).join(', ')} con renovación vencida.`);
    if(m.sdoh.length) parts.push(`Factores sociales a abordar: ${m.sdoh.map(s=>I18N.en.sdoh_labels[s].toLowerCase()).join(', ')}.`);
    if(m.gaps.length) parts.push(`Gaps in care abiertos: ${m.gaps.map(g=>I18N.en.gap_labels[g].toLowerCase()).join('; ')}.`);
    if(m.story==='wedding') parts.push(`Meta personal que la motiva: ir en ómnibus al casamiento de su hija en junio.`);
    if(!m.hra.done) parts.push(`HRA inicial pendiente — vence ${fmtDate(m.hra.due)} (regulatorio).`);
  }
  return parts.join(' ');
}
function aiDraftNote(m, kind){
  const en = true;
  const first = m.name.split(' ')[0];
  if(kind==='ict'){
    const team = ['Maria Gonzalez, RN (care manager)'].concat((m.careTeam||[]).map(x=>`${x.name} (${I18N.en.roles[x.role]||x.role})`));
    return `DRAFT — Care team meeting, 25 minutes. Attendees: ${team.join('; ')}. Reviewed care plan goals for ${first}: progress on each problem, open interventions and recent alerts. Is the plan working? Discussed barriers and member feedback. Decisions: (1) continue current interventions; (2) adjust outreach cadence; (3) reassess at next meeting or sooner on alert. Care plan changes recorded.`;
  }
  if(kind==='call'){
    return en
     ? `DRAFT — Phone call, 14 minutes. Spoke with ${first}. Reviewed current medications and recent events. Member reports ${m.risk==='high'?'ongoing difficulties managing their condition':'feeling generally stable'}. Discussed next steps from the care plan and confirmed preferred contact method (${m.contactPref}). Barriers mentioned: ${m.sdoh.length? m.sdoh.map(s=>t('sdoh_labels.'+s).toLowerCase()).join(', ') : 'none new'}. Follow-up scheduled per plan.`
     : `BORRADOR — Llamada telefónica, 14 minutos. Se habló con ${first}. Se repasó la medicación actual y los eventos recientes. El miembro refiere ${m.risk==='high'?'dificultades para manejar su condición':'sentirse en general estable'}. Se conversaron los próximos pasos del care plan y se confirmó el canal de contacto preferido (${m.contactPref}). Barreras mencionadas: ${m.sdoh.length? m.sdoh.map(s=>t('sdoh_labels.'+s).toLowerCase()).join(', ') : 'ninguna nueva'}. Seguimiento agendado según el plan.`;
  }
  return en
   ? `DRAFT — Home visit, 40 minutes. Visited ${first} at ${m.address}. Home environment: ${m.living}. Medication review completed — verified what is actually being taken vs. prescribed; checked storage and refill dates. Food in the home: adequate. Fall-risk quick check performed. Member's questions answered; caregiver ${m.caregiver? '('+m.caregiver+') present and engaged' : 'not present'}. Actions: update care plan interventions, arrange follow-ups as noted.`
   : `BORRADOR — Visita domiciliaria, 40 minutos. Se visitó a ${first} en ${m.address}. Entorno del hogar: ${m.living}. Se completó la revisión de medicación — verificado lo que realmente toma vs. lo prescripto; se revisó almacenamiento y fechas de renovación. Comida en el hogar: adecuada. Chequeo rápido de riesgo de caídas realizado. Se respondieron las preguntas del miembro; cuidador/a ${m.caregiver? '('+m.caregiver+') presente y participativo' : 'no presente'}. Acciones: actualizar intervenciones del care plan y coordinar seguimientos.`;
}
const PROTOCOL_SUGGESTIONS = {
  'Type 2 diabetes':{en:['HbA1c test every 3 months until below individualized goal (protocol)','Annual diabetic eye exam referral','Annual diabetic foot exam','Assess hypoglycemia awareness at each contact'], es:['Test de HbA1c cada 3 meses hasta alcanzar el objetivo individualizado (protocolo)','Derivación anual a examen ocular diabético','Examen anual de pie diabético','Evaluar conciencia de hipoglucemia en cada contacto']},
  'Congestive heart failure':{en:['Daily weight self-monitoring with call threshold (+3 lb / 2 days)','Medication reconciliation after any dose change','Sodium intake education'], es:['Automonitoreo diario de peso con umbral de llamada (+1,5 kg / 2 días)','Reconciliación de medicación después de cualquier cambio de dosis','Educación sobre consumo de sodio']},
  'COPD':{en:['Inhaler technique check at next contact','Flu and pneumococcal vaccination review','Action plan for exacerbation early signs'], es:['Chequeo de técnica de inhalador en el próximo contacto','Revisión de vacunas antigripal y antineumocócica','Plan de acción ante signos tempranos de exacerbación']},
  'Hypertension':{en:['Home blood-pressure log — review weekly','Medication adherence check at each contact'], es:['Registro domiciliario de presión — revisar semanalmente','Chequeo de adherencia a medicación en cada contacto']}
};
function suggestionsFor(m){
  const lang = DB.settings.lang;
  const out = [];
  m.conditions.forEach(c => { const key = Object.keys(PROTOCOL_SUGGESTIONS).find(k => c.toLowerCase().includes(k.toLowerCase())); if(key) PROTOCOL_SUGGESTIONS[key][lang].forEach(s=>out.push(s)); });
  return out.slice(0,5);
}

/* =================== Router =================== */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  return h ? h.split('/').map(decodeURIComponent) : [];
}
function nav(path){ location.hash = '#/' + path; }
window.addEventListener('hashchange', () => render());

/* =================== Shell =================== */
function shell(active, inner){
  const u = currentUser();

    ['dashboard','grid', t('nav_dashboard'), false],
    ['alerts','bell', t('nav_alerts'), true],
    ['members','users', t('nav_members'), false],
    ...(isDir? [['leadership','chart', t('nav_leadership'), false]] : [['leadership','chart', t('nav_leadership'), false]]),
    ['reports','file', t('nav_reports'), false],
    ['resources','heart', t('nav_resources'), false],
    ['settings','sliders', t('nav_settings'), false],
  ];
  return `
  <aside class="sidebar">

    <div class="plan-chip"><strong>${esc(DB.settings.planName)}</strong>${t('plan_type')}</div>
    <nav class="menu">
      ${navItems.map(([r,ic,label,badge]) => `<a href="#/${r}" class="${active===r?'active':''}">${icon(ic)}<span>${label}</span>${badge&&newAlerts? `<span class="badge count">${newAlerts}</span>`:''}</a>`).join('')}
    </nav>
    <div class="foot">${t('demo_banner')}</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search"><span>${icon('search','sm')}</span><input id="globalSearch" type="search" placeholder="${t('search_ph')}" autocomplete="off" aria-label="${t('search_ph')}"><div id="searchResults"></div></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="langBtn" title="${t('set_lang')}" aria-label="${t('set_lang')}">${icon('globe')}</button>
      <button class="iconbtn" id="themeBtn" title="${t('set_theme')}" aria-label="${t('set_theme')}">${icon(DB.settings.theme==='light'?'moon':'sun')}</button>
      <div class="userbox">
        <div class="avatar">${esc(u.initials)}</div>

        <select id="userSwitch" aria-label="user">${DB.users.map(x=>`<option value="${x.id}" ${x.id===u.id?'selected':''}>${esc(x.name.split(',')[0])}</option>`).join('')}</select>
      </div>

  </div>`;
}
function bindShell(){
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.onclick = () => { DB.settings.theme = DB.settings.theme==='light'?'dark':'light'; save(); applyTheme(); render(); };
  const langBtn = document.getElementById('langBtn');
  if(langBtn) langBtn.onclick = () => { DB.settings.lang = DB.settings.lang==='en'?'es':'en'; save(); applyTheme(); render(); };
  const us = document.getElementById('userSwitch');
  if(us) us.onchange = e => { DB.settings.currentUser = e.target.value; save(); const u=currentUser(); nav(u.role==='director'?'leadership':'dashboard'); render(); };
  const gs = document.getElementById('globalSearch');
  if(gs){
    gs.oninput = () => {
      const q = gs.value.trim().toLowerCase();
      const box = document.getElementById('searchResults');
      if(!q){ box.innerHTML=''; return; }
      const hits = DB.members.filter(m=>m.name.toLowerCase().includes(q)).slice(0,6);
      box.innerHTML = hits.length
        ? `<div class="search-results">${hits.map(m=>`<a href="#/members/${m.id}/summary">${esc(m.name)} <span>${riskBadge(m.risk)}</span></a>`).join('')}</div>`
        : `<div class="search-results"><a href="#/members" style="color:var(--muted)">${t('no_results')}</a></div>`;
    };
    gs.onblur = () => setTimeout(()=>{ const b=document.getElementById('searchResults'); if(b) b.innerHTML=''; }, 250);
  }
}

<script>
/* =================== Views =================== */
function alertItem(a, compact){

  const statusBadge = a.status==='new' ? `<span class="badge ${a.priority==='critical'?'high':a.priority==='high'?'medium':'neutral'}">${t('f_'+(a.priority==='medium'?'medium':a.priority))||a.priority}</span>` : `<span class="badge ok">${a.status==='acted'?t('acted_on'):t('dismissed')}</span>`;

}
function bindAlertActions(){

      () => { DB.tasks.push({id:uid('t'), memberId:a.memberId, text:document.getElementById('or_tx').value.trim()||t('alert_types.'+a.type), due:document.getElementById('or_dt').value||daysAhead(1), done:false, source:'alert', alertId:a.id, channel:document.getElementById('or_ch').value}); save(); toast(t('outreach_scheduled')); });
  });
  document.querySelectorAll('[data-act="dismiss"]').forEach(b => b.onclick = () => {
    const a = DB.alerts.find(x=>x.id===b.dataset.id); a.status='dismissed'; save(); render();

/* ---------- Dashboard ---------- */
function vDashboard(){
  const u = currentUser();
  const newAlerts = DB.alerts.filter(a=>a.status==='new');
  const urgent = newAlerts.filter(a=>a.priority!=='medium').slice(0,5);

  return `
  <div class="page-head"><div><h1>${t('hello')}, ${esc(u.name.split(' ')[0])} 👋</h1><div class="sub">${t('dash_sub')}</div></div></div>

        ${urgent.length? urgent.map(a=>alertItem(a,true)).join('') : `<div class="empty">${icon('check')}${t('no_alerts')}</div>`}
      </div>
      <div class="card" style="margin-top:18px">

            <button class="iconbtn" style="width:38px;height:38px" data-deltask="${x.id}" aria-label="${t('delete')}">${icon('trash','sm')}</button></div>`;}).join('')}
          <form id="taskForm" style="display:flex;gap:8px;margin-top:14px">
            <input id="taskInput" placeholder="${t('task_ph')}" style="flex:1;padding:10px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;min-height:44px" required>
            <button class="btn small" type="submit">${icon('plus','sm')}${t('add')}</button>

}
function bindDashboard(){
  bindAlertActions();
  document.querySelectorAll('[data-task]').forEach(c => c.onchange = () => { const x = DB.tasks.find(k=>k.id===c.dataset.task); x.done = c.checked; save(); render(); });
  document.querySelectorAll('[data-deltask]').forEach(b => b.onclick = () => { DB.tasks = DB.tasks.filter(k=>k.id!==b.dataset.deltask); save(); render(); });
  const f = document.getElementById('taskForm');
  if(f) f.onsubmit = e => { e.preventDefault(); const v = document.getElementById('taskInput').value.trim(); if(!v) return;
    DB.tasks.push({id:uid('t'), memberId:null, text:v, due:daysAhead(3), done:false, source:'manual'}); save(); render(); };

/* ---------- Alerts ---------- */
function vAlerts(filter){
  filter = filter || 'all';
  let list = DB.alerts.slice().sort((a,b)=> (a.status==='new'?0:1)-(b.status==='new'?0:1) || ({critical:0,high:1,medium:2}[a.priority]-{critical:0,high:1,medium:2}[b.priority]) || b.date.localeCompare(a.date));
  if(filter==='new') list = list.filter(a=>a.status==='new');
  if(filter==='handled') list = list.filter(a=>a.status!=='new');
  if(['critical','high','medium'].includes(filter)) list = list.filter(a=>a.priority===filter && a.status==='new');
  const fbtn = (key,label) => `<a class="btn small ${filter===key?'':'ghost'}" href="#/alerts/${key}">${label}</a>`;
  return `
  <div class="page-head"><div><h1>${t('alerts_title')}</h1><div class="sub">${t('alerts_sub')}</div></div></div>
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    ${fbtn('all',t('f_all'))}${fbtn('new',t('f_new'))}${fbtn('critical',t('f_critical'))}${fbtn('high',t('f_high'))}${fbtn('medium',t('f_medium'))}${fbtn('handled',t('f_handled'))}
  </div>
  <div class="card">${list.length? list.map(a=>alertItem(a,false)).join('') : `<div class="empty">${icon('check')}${t('no_alerts')}</div>`}</div>`;
}

/* ---------- Members list ---------- */
function vMembers(riskF, pageN, q){
  riskF = ['high','medium','low'].includes(riskF) ? riskF : 'all';
  pageN = Math.max(1, parseInt(pageN||'1',10) || 1);
  q = (q||'').toLowerCase();
  const order = {high:0, medium:1, low:2};
  let list = DB.members.slice().sort((a,b)=>order[a.risk]-order[b.risk] || b.riskScore-a.riskScore);
  if(riskF!=='all') list = list.filter(m=>m.risk===riskF);
  if(q) list = list.filter(m=> m.name.toLowerCase().includes(q) || m.conditions.join(' ').toLowerCase().includes(q) || m.lang.toLowerCase().includes(q));
  const PER = 25, pages = Math.max(1, Math.ceil(list.length/PER)); pageN = Math.min(pageN, pages);
  const slice = list.slice((pageN-1)*PER, pageN*PER);
  const href = (r,p) => `#/members/f/${r}/${p}${q?('/'+encodeURIComponent(q)):''}`;
  const counts = {all:DB.members.length, high:DB.members.filter(m=>m.risk==='high').length, medium:DB.members.filter(m=>m.risk==='medium').length, low:DB.members.filter(m=>m.risk==='low').length};
  const fbtn = (key,label) => `<a class="btn small ${riskF===key?'':'ghost'}" href="${href(key,1)}">${label} <span style="opacity:.7">${fmtNum(counts[key])}</span></a>`;
  return `
  <div class="page-head"><div><h1>${t('members_title')}</h1><div class="sub">${t('members_sub')}</div></div>
    <div class="actions"><button class="btn" id="addMemberBtn">${icon('plus','sm')}${t('add_member')}</button></div></div>
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    ${fbtn('all',t('f_risk_all'))}${fbtn('high',t('risk_high'))}${fbtn('medium',t('risk_medium'))}${fbtn('low',t('risk_low'))}
    <input id="memberFilter" type="search" value="${esc(q)}" placeholder="${t('members_search_ph')}" style="margin-left:auto;min-width:260px;padding:9px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;min-height:42px">
  </div>
  <div class="card" style="overflow-x:auto">
    <table class="tbl">
      <thead><tr><th>${t('col_member')}</th><th>${t('col_age')}</th><th>${t('col_risk')}</th><th>${t('col_conditions')}</th><th>HRA</th><th>${t('col_plan')}</th><th>${t('col_lastcontact')}</th><th>${t('col_alerts')}</th></tr></thead>
      <tbody>
      ${slice.map(m=>{
        const al = alertsFor(m.id).length;
        const hra = m.hra.done? `<span class="badge ok">${t('hra_done')}</span>` : `<span class="badge ${daysUntil(m.hra.due)<7?'high':'medium'}">${t('hra_due')} ${fmtDate(m.hra.due)}</span>`;
        const plan = m.carePlan.status==='active'? `<span class="badge ok">${t('plan_active')}</span>` : `<span class="badge medium">${t('plan_draft')}</span>`;
        return `<tr class="rowlink" data-go="members/${m.id}/summary">
          <td><b style="color:var(--ink)">${esc(m.name)}</b><div style="font-size:.8rem;color:var(--muted)">${esc(m.lang)}</div></td>
          <td>${m.age}</td><td>${riskBadge(m.risk)}${riskTrendMini(m)}</td>
          <td style="max-width:260px">${m.conditions.map(c=>esc(c)).join(' · ')}</td>
          <td>${hra}</td><td>${plan}</td><td>${fmtDate(m.lastContact)}</td>
          <td>${al? `<span class="badge count">${al}</span>`:'—'}</td></tr>`;
      }).join('')}
      ${slice.length? '' : `<tr><td colspan="8"><div class="empty">${t('no_results')}</div></td></tr>`}
      </tbody>
    </table>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted);flex-wrap:wrap">
      <span>${t('showing')} ${list.length? fmtNum((pageN-1)*PER+1):0}–${fmtNum(Math.min(pageN*PER, list.length))} ${t('of_total')} ${fmtNum(list.length)}</span>
      <span style="flex:1"></span>
      <a class="btn small ghost ${pageN<=1?'disabled':''}" href="${href(riskF, Math.max(1,pageN-1))}" ${pageN<=1?'aria-disabled="true" style="opacity:.45;pointer-events:none"':''}>${icon('arrow-l','sm')}${t('prev')}</a>
      <span>${t('page')} ${fmtNum(pageN)} / ${fmtNum(pages)}</span>
      <a class="btn small ghost" href="${href(riskF, Math.min(pages,pageN+1))}" ${pageN>=pages?'aria-disabled="true" style="opacity:.45;pointer-events:none"':''}>${t('next')}</a>
    </div>
  </div>`;
}
function bindMembers(){
  document.querySelectorAll('[data-go]').forEach(r => r.onclick = () => nav(r.dataset.go));
  const mf = document.getElementById('memberFilter');
  if(mf){ let tmr; mf.oninput = () => { clearTimeout(tmr); tmr = setTimeout(()=>{ const r = route(); const risk = r[1]==='f'? r[2] : 'all'; const v = mf.value.trim(); nav(`members/f/${risk}/1${v?('/'+encodeURIComponent(v)):''}`); setTimeout(()=>{ const el=document.getElementById('memberFilter'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); }, 350); }; }
  const b = document.getElementById('addMemberBtn');
  if(b) b.onclick = () => openMemberModal();
}
function openMemberModal(){
  const f = t('new_member_fields');
  showModal(`<h2>${t('add_member')}</h2>`, `
    <div class="field"><label>${f.name}</label><input id="nm_name" required></div>
    <div class="grid cols-2">
      <div class="field"><label>${f.age}</label><input id="nm_age" type="number" min="18" max="110" value="70"></div>
      <div class="field"><label>${f.sex}</label><select id="nm_sex"><option value="F">${t('sex_f')}</option><option value="M">${t('sex_m')}</option></select></div>
    </div>
    <div class="grid cols-2">
      <div class="field"><label>${f.lang}</label><input id="nm_lang" value="English"></div>
      <div class="field"><label>${f.risk}</label><select id="nm_risk"><option value="low">${t('risk_low')}</option><option value="medium" selected>${t('risk_medium')}</option><option value="high">${t('risk_high')}</option></select></div>
    </div>
    <div class="field"><label>${f.phone}</label><input id="nm_phone" value="(702) 555-0100"></div>
    <div class="field"><label>${f.address}</label><input id="nm_addr"></div>
    <div class="field"><label>${f.conditions}</label><input id="nm_cond" placeholder="Type 2 diabetes, Hypertension"></div>
  `, () => {
    const name = document.getElementById('nm_name').value.trim(); if(!name) return false;
    const risk = document.getElementById('nm_risk').value;
    DB.members.push({id:uid('m'), name, age:+document.getElementById('nm_age').value||70, sex:document.getElementById('nm_sex').value,
      lang:document.getElementById('nm_lang').value||'English', phone:document.getElementById('nm_phone').value, address:document.getElementById('nm_addr').value||'—',
      living:'—', caregiver:null, contactPref:'Phone call', memberSince:daysAgo(0), assignedTo:DB.settings.currentUser,
      risk, riskScore:{low:20,medium:50,high:75}[risk], riskHistory:[{date:daysAgo(0), score:{low:20,medium:50,high:75}[risk], tier:risk, reason:'Initial stratification from enrollment data — HRA pending'}], careTeam:[], conditions:(document.getElementById('nm_cond').value||'').split(',').map(s=>s.trim()).filter(Boolean),
      hra:{done:false, date:null, due:daysAhead(30)}, carePlan:{status:'draft', updated:daysAgo(0), due:daysAhead(30)},
      sdoh:[], gaps:[], util:{er:0, ip:0, pcp:0}, lastContact:null, pharmacy:[], labs:[],
      benefits:{ridesUsed:0, ridesTotal:10, mealsUsed:0, mealsTotal:0, otcUsed:0, otcTotal:120}, providers:[], timeline:[{date:daysAgo(0), type:'ok', t:'new', d: DB.settings.lang==='en'?'New member enrolled — Careai is gathering available history':'Miembro nuevo enrolado — Careai está recopilando la historia disponible'}]});
    save(); toast(t('saved')); return true;
  });
}
</script>
<script>
/* ---------- Member detail ---------- */
function vMember(id, tab){
  const m = member(id);
  if(!m) return `<div class="empty">${t('no_results')}</div>`;
  tab = tab || 'summary';
  const al = alertsFor(id).length;
  const tabs = [['summary',t('tab_summary')],['plan',t('tab_plan')],['notes',t('tab_notes')],['data',t('tab_data')],['alerts',`${t('tab_alerts')}${al?` (${al})`:''}`]];
  return `
  <a href="#/members" style="display:inline-flex;align-items:center;gap:7px;font-weight:700;margin-bottom:14px">${icon('arrow-l','sm')}${t('nav_members')}</a>
  <div class="card"><div class="card-body member-hero">
    <div class="avatar">${initials(m.name)}</div>
    <div style="flex:1;min-width:260px">
      <h1>${esc(m.name)}</h1>
      <div class="meta">${m.age} ${DB.settings.lang==='en'?'years':'años'} · ${m.sex==='F'?t('sex_f'):t('sex_m')} · ${esc(m.lang)} · ${t('member_since')} ${fmtDate(m.memberSince)} · ${t('assigned_to')}: ${esc((DB.users.find(u=>u.id===m.assignedTo)||{}).name||'—')}</div>
      <div style="margin-top:10px">${riskBadge(m.risk)} ${riskScoreBadge(m)} ${m.conditions.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn secondary small" href="tel:${esc(m.phone)}">${icon('phone','sm')}${esc(m.phone)}</a>
    </div>
  </div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<a href="#/members/${id}/${k}" class="${tab===k?'active':''}">${l}</a>`).join('')}</div>
  ${tab==='summary'? tabSummary(m) : tab==='plan'? tabPlan(m) : tab==='notes'? tabNotes(m) : tab==='data'? tabData(m) : tabAlerts(m)}`;
}

function tabSummary(m){
  const unfilled = m.pharmacy.filter(p=>p.status==='unfilled');
  return `
  <div class="ai-box" style="margin-bottom:18px">
    <div class="tag">${icon('sparkle','sm')}${t('ai_summary')}</div>
    <p>${esc(aiSummary(m))}</p>
    <div class="ai-note">${icon('shield','sm')}${t('ai_reviewed')}</div>
  </div>
  <div class="grid cols-3">
    <div class="card"><div class="card-head"><h3>${t('sum_risk')}</h3>${riskBadge(m.risk)}</div><div class="card-body" style="padding-top:8px">
      ${(()=>{ const tr = riskTrend(m); return `<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px"><span style="font-family:Cambria,Georgia,serif;font-size:2rem;font-weight:700;color:var(--ink)">${m.riskScore}</span><span style="font-size:.9rem;color:${tr.delta>0?'var(--red)':tr.delta<0?'var(--teal)':'var(--muted)'};font-weight:700">${riskArrow(tr.delta)}${tr.delta? ' '+Math.abs(tr.delta):''}${tr.prev? ` <span style="font-weight:400;color:var(--muted)">(${t('risk_prev')} ${tr.prev.score})</span>`:''}</span></div>`; })()}
      ${(()=>{ const c = riskComponents(m); return `<div style="font-size:.82rem;color:var(--muted);margin:-4px 0 12px"><b style="color:var(--ink)">${t('comp_hra')} ${c.hra}</b> + <b style="color:var(--ink)">${t('comp_acuity')} ${c.acuity}</b> <span>(${c.dx} ${t('comp_dx')} · ${c.util} ${t('comp_util')} · ${c.rx} ${t('comp_rx')} · ${t('comp_hcc')} ${c.hcc})</span></div>`; })()}
      <b style="color:var(--ink);font-size:.92rem">${t('risk_history')}</b>
      ${(m.riskHistory||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map((h,i,arr)=>{ const prev = arr[i+1]; const d = prev? h.score-prev.score : 0;
        return `<div class="intervention"><span style="margin-top:2px;color:${d>0?'var(--red)':d<0?'var(--teal)':'var(--muted)'}">${icon('activity','sm')}</span><div class="tx"><b style="color:var(--ink)">${h.score}</b> <span style="font-size:.85rem;color:${d>0?'var(--red)':d<0?'var(--teal)':'var(--muted)'}">${prev? riskArrow(d)+(d?Math.abs(d):''):''}</span> ${prev&&prev.tier!==h.tier? `<span class="badge ${h.tier}">${t('risk_'+prev.tier)} → ${t('risk_'+h.tier)}</span>`:''}<div style="font-size:.8rem;color:var(--muted)">${fmtDate(h.date)} · ${esc(h.reason)}</div></div></div>`; }).join('')}
    </div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_profile')}</h3></div><div class="card-body"><dl class="kv">
      <dt>${t('phone')}</dt><dd>${esc(m.phone)}</dd>
      <dt>${t('address')}</dt><dd>${esc(m.address)}</dd>
      <dt>${t('living')}</dt><dd>${esc(m.living)}</dd>
      <dt>${t('caregiver')}</dt><dd>${esc(m.caregiver||t('none'))}</dd>
      <dt>${t('contact_pref')}</dt><dd>${esc(m.contactPref)}</dd>
      <dt>${t('language')}</dt><dd>${esc(m.lang)}</dd>
    </dl></div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_sdoh')}</h3></div><div class="card-body">
      ${m.sdoh.length? m.sdoh.map(s=>`<span class="chip warn">${icon('home','sm')}${t('sdoh_labels.'+s)}</span>`).join('') : `<span class="badge ok">${t('none')}</span>`}
      <div style="margin-top:14px"><a href="#/resources" class="btn small secondary">${icon('heart','sm')}${t('nav_resources')}</a></div>
    </div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_gaps')}</h3></div><div class="card-body">

    </div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_labs')}</h3></div><div class="card-body" style="padding-top:8px">

    </div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_benefits')}</h3></div><div class="card-body">

      <div><div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px"><b style="color:var(--ink)">$${fmtNum(m.benefits.otcUsed)} ${t('of')} $${fmtNum(m.benefits.otcTotal)} ${t('otc')}</b></div><div class="progress"><i style="width:${m.benefits.otcUsed/m.benefits.otcTotal*100}%"></i></div></div>
    </div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_careteam')}</h3>${(m.careTeam||[]).length? `<span class="badge neutral">${(m.careTeam||[]).length+1}</span>`:''}</div><div class="card-body" style="padding-top:8px">
      <div class="intervention"><span style="margin-top:2px;color:var(--teal)">${icon('users','sm')}</span><div class="tx"><b style="color:var(--ink)">${esc((DB.users.find(u=>u.id===m.assignedTo)||{}).name||'—')}</b><div style="font-size:.8rem;color:var(--muted)">${t('careteam_cm')}</div></div></div>

      ${m.providers.length? m.providers.map(p=>`<div class="intervention"><span style="margin-top:2px;color:var(--teal)">${icon('users','sm')}</span><div class="tx"><b style="color:var(--ink)">${esc(p.name)}</b><div style="font-size:.8rem;color:var(--muted)">${esc(p.specialty)} · ${fmtDate(p.last)}</div></div></div>`).join(''):`<span class="badge neutral">${t('none')}</span>`}
    </div></div>
    <div class="card"><div class="card-head"><h3>${t('sum_timeline')}</h3></div><div class="card-body"><div class="timeline">

function tabPlan(m){

  const sugg = suggestionsFor(m);
  return `
  <div class="page-head" style="margin-bottom:14px"><div><h2>${t('plan_title')}</h2><div class="sub">${t('plan_sub')}</div></div>
    <div class="actions" style="align-items:center;flex-wrap:wrap">
      ${plan.memberReview? `<span class="badge ok">${icon('users','sm')} ${t('member_review')} · ${t('ch_'+plan.memberReview.channel)} · ${fmtDate(plan.memberReview.date)}</span>` : `<span class="badge medium">${t('not_reviewed')}</span>`}
      ${plan.status==='draft'? (plan.memberReview? `<button class="btn" id="approvePlan">${icon('check','sm')}${t('plan_approve')}</button>` : `<button class="btn" id="reviewMember">${icon('users','sm')}${t('mark_reviewed')}</button><button class="btn secondary" disabled title="${t('approve_hint')}" style="opacity:.55;cursor:not-allowed">${icon('check','sm')}${t('plan_approve')}</button>`) : `<span class="badge ok">${t('plan_approved_by')} ${esc(plan.reviewedBy)} · ${fmtDate(plan.updated)}</span>`}
    </div></div>
  ${plan.status==='draft'? `<div class="ai-box" style="margin-bottom:16px"><div class="tag">${icon('sparkle','sm')}${t('plan_drafted')}</div><p>${DB.settings.lang==='en'?'This plan was drafted by Careai from the care summary, clinical protocols and the member’s history. Review, adjust with the member, and approve.':'Este plan fue redactado por Careai a partir del care summary, protocolos clínicos y la historia del miembro. Revisalo, ajustalo con el miembro y aprobalo.'}</p></div>`:''}
  <div class="grid cols-2" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><h3>${t('member_priorities')}</h3><button class="btn small ghost" id="editPriorities">${icon('edit','sm')}${t('edit')}</button></div><div class="card-body"><p style="font-size:1.02rem;font-style:italic;color:var(--ink)">${plan.memberPriorities? esc(plan.memberPriorities) : `<span style="color:var(--muted);font-style:normal">${t('member_priorities_ph')}</span>`}</p></div></div>
    <div class="card"><div class="card-head"><h3>${t('smart_goal')}</h3><button class="btn small ghost" id="editSmart">${icon('edit','sm')}${t('edit')}</button></div><div class="card-body"><p id="smartText" style="font-size:1.02rem">${esc(plan.smart)}</p></div></div>
  </div>
  ${plan.problems.map((p,pi)=>`
  <div class="plan-problem">
    <div class="ph"><span class="badge neutral">${t('problem')} ${pi+1}</span><h3>${esc(p.title)}</h3>
      ${p.goalStatus? `<span class="badge ${ {met:'ok',met_late:'medium',in_progress:'neutral',not_met:'high'}[p.goalStatus] }">${t('goal_'+p.goalStatus)}</span>`:''}${p.goalDue? `<span style="font-size:.8rem;color:var(--muted)">${t('goal_due')} ${fmtDate(p.goalDue)}</span>`:''}
      <button class="btn small ghost" data-delprob="${p.id}">${icon('trash','sm')}</button></div>
    <div class="pb">
      <p style="color:var(--muted);font-size:.92rem;margin-bottom:10px">${esc(p.detail)}</p>
      <dl class="kv" style="grid-template-columns:130px 1fr;margin-bottom:12px"><dt>${t('goal')}</dt><dd>${esc(p.goal)}</dd><dt>${t('measure')}</dt><dd>${esc(p.measure)}</dd></dl>
      <b style="color:var(--ink);font-size:.92rem">${t('interventions')}</b>
      ${p.interventions.map(i=>`<div class="intervention"><input type="checkbox" data-int="${p.id}:${i.id}" ${i.done?'checked':''} aria-label="intervention"><div class="tx ${i.done?'done':''}">${esc(i.text)}</div><button class="iconbtn" style="width:38px;height:38px" data-delint="${p.id}:${i.id}" aria-label="${t('delete')}">${icon('trash','sm')}</button></div>`).join('')}
      <form data-addint="${p.id}" style="display:flex;gap:8px;margin-top:12px"><input placeholder="${t('int_ph')}" style="flex:1;padding:9px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;min-height:42px" required><button class="btn small secondary" type="submit">${icon('plus','sm')}${t('add_intervention')}</button></form>
    </div>
  </div>`).join('')}
  ${sugg.length? `<div class="ai-box"><div class="tag">${icon('sparkle','sm')}${t('suggested')}</div>
    ${sugg.map((s,i)=>`<div class="intervention"><span style="color:var(--teal);margin-top:2px">${icon('sparkle','sm')}</span><div class="tx">${esc(s)}</div><button class="btn small secondary" data-sugg="${i}">${t('add_to_plan')}</button></div>`).join('')}
  </div>`:''}`;
}
function bindPlan(m){
  const plan = DB.carePlans[m.id];
  const dp = document.getElementById('draftPlanBtn');
  if(dp) dp.onclick = () => {
    DB.carePlans[m.id] = {status:'draft', reviewedBy:null, updated:daysAgo(0), memberReview:null, memberPriorities:'',
      smart: DB.settings.lang==='en' ? `Within 60 days, ${m.name.split(' ')[0]} will complete an initial assessment, agree on personal goals, and complete pending preventive care.` : `Dentro de 60 días, ${m.name.split(' ')[0]} completará una evaluación inicial, acordará metas personales y completará el cuidado preventivo pendiente.`,
      problems:[{id:uid('p'), goalStatus:'in_progress', goalDue:daysAhead(30), title: DB.settings.lang==='en'?'Initial engagement':'Vinculación inicial', detail: DB.settings.lang==='en'?'New to care management; needs assessment and relationship building.':'Nuevo en care management; requiere evaluación y construcción de vínculo.', goal: DB.settings.lang==='en'?'Complete HRA and first care conversation.':'Completar el HRA y la primera conversación de cuidado.', measure: DB.settings.lang==='en'?'HRA completed within regulatory timeframe.':'HRA completado dentro del plazo regulatorio.', interventions:[{id:uid('i'), text: DB.settings.lang==='en'?'Outreach call — introduce care management, schedule HRA':'Llamada de contacto — presentar care management, agendar el HRA', done:false}]}]};
    save(); render();
  };
  if(!plan) return;
  const ap = document.getElementById('approvePlan');
  if(ap) ap.onclick = () => { plan.status='active'; plan.reviewedBy = currentUser().name; plan.updated = daysAgo(0); m.carePlan.status='active'; m.carePlan.updated=daysAgo(0); save(); toast(t('plan_approved_toast')); render(); };
  const rv = document.getElementById('reviewMember');
  if(rv) rv.onclick = () => {
    const opts = ['phone','visit','video','inperson'].map(c=>`<option value="${c}">${t('ch_'+c)}</option>`).join('');
    showModal(`<h2>${t('mark_reviewed')}</h2>`, `<label style="display:block;margin-bottom:12px"><b>${t('review_channel')}</b><select id="rv_ch" style="display:block;width:100%;margin-top:6px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit">${opts}</select></label><label style="display:block;margin-bottom:12px"><b>${t('review_date')}</b><input id="rv_dt" type="date" value="${daysAgo(0)}" style="display:block;width:100%;margin-top:6px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit"></label><label style="display:block"><b>${t('member_priorities')}</b><textarea id="rv_pr" rows="3" placeholder="${t('member_priorities_ph')}" style="display:block;width:100%;margin-top:6px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit">${esc(plan.memberPriorities||'')}</textarea></label>`,
      () => { plan.memberReview = {date: document.getElementById('rv_dt').value || daysAgo(0), channel: document.getElementById('rv_ch').value}; const pr = document.getElementById('rv_pr').value.trim(); if(pr) plan.memberPriorities = pr; plan.updated = daysAgo(0); save(); toast(t('plan_reviewed_toast')); });
  };
  const ep = document.getElementById('editPriorities');
  if(ep) ep.onclick = () => { const v = prompt(t('member_priorities'), plan.memberPriorities||''); if(v===null) return; plan.memberPriorities = v; save(); render(); };
  const es_ = document.getElementById('editSmart');
  if(es_) es_.onclick = () => { const v = prompt(t('smart_goal'), plan.smart); if(v===null) return; plan.smart = v; save(); render(); };
  document.querySelectorAll('[data-int]').forEach(c => c.onchange = () => { const [pid,iid] = c.dataset.int.split(':'); const p = plan.problems.find(x=>x.id===pid); const i = p.interventions.find(x=>x.id===iid); i.done = c.checked; save(); render(); });
  document.querySelectorAll('[data-delint]').forEach(b => b.onclick = () => { const [pid,iid] = b.dataset.delint.split(':'); const p = plan.problems.find(x=>x.id===pid); p.interventions = p.interventions.filter(x=>x.id!==iid); save(); render(); });
  document.querySelectorAll('[data-delprob]').forEach(b => b.onclick = () => { if(!confirm(t('delete')+'?')) return; plan.problems = plan.problems.filter(x=>x.id!==b.dataset.delprob); save(); render(); });
  document.querySelectorAll('[data-addint]').forEach(f => f.onsubmit = e => { e.preventDefault(); const v = f.querySelector('input').value.trim(); if(!v) return; const p = plan.problems.find(x=>x.id===f.dataset.addint); p.interventions.push({id:uid('i'), text:v, done:false}); save(); render(); });
  document.querySelectorAll('[data-sugg]').forEach(b => b.onclick = () => { const s = suggestionsFor(m)[+b.dataset.sugg]; if(plan.problems.length){ plan.problems[0].interventions.push({id:uid('i'), text:s, done:false}); save(); toast(t('saved')); render(); } });
}

function tabNotes(m){
  const notes = DB.notes.filter(n=>n.memberId===m.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="page-head" style="margin-bottom:14px"><div><h2>${t('notes_title')}</h2><div class="sub">${t('notes_sub')}</div></div>
    <div class="actions">
      <button class="btn" data-rec="call">${icon('mic','sm')}${t('record_call')}</button>
      <button class="btn secondary" data-rec="home_visit">${icon('home','sm')}${t('record_visit')}</button>
      <button class="btn secondary" data-rec="ict">${icon('users','sm')}${t('record_ict')}</button>
      <button class="btn ghost" id="manualNote">${icon('edit','sm')}${t('manual_note')}</button>
    </div></div>

  <div class="card">
    ${notes.length? notes.map(n=>`
    <div class="note-item">
      <div class="nh"><span class="ty">${t('type_'+(n.type==='ict'?'ict':n.type))}</span><span class="dt">${fmtDate(n.date)}</span>
        ${n.status==='draft'? `<span class="badge medium">${t('draft')}</span>` : `<span class="badge ok">${t('approved_note')}</span>`}
        ${n.author? `<span class="dt">· ${esc(n.author)}</span>`:''}
        ${n.lang? `<span class="badge neutral">${t('note_lang')} ${esc(n.lang)}</span>`:''}
        ${n.type==='ict'? `<span class="badge ok">${icon('shield','sm')} ${t('audit_evidence')}</span>`:''}
        <span style="flex:1"></span>
        ${n.status==='draft'? `<button class="btn small" data-approvenote="${n.id}">${icon('check','sm')}${t('approve_note')}</button>` : ''}
        <button class="iconbtn" style="width:38px;height:38px" data-delnote="${n.id}" aria-label="${t('delete')}">${icon('trash','sm')}</button>
      </div>
      ${n.attendees? `<div style="font-size:.85rem;color:var(--muted);margin:6px 0 4px"><b style="color:var(--ink)">${t('note_attendees')}:</b> ${n.attendees.map(esc).join(' · ')}</div>`:''}
      ${n.status==='draft'? `<textarea data-notetext="${n.id}">${esc(n.content)}</textarea>` : `<p>${esc(n.content)}</p>`}
      ${n.decisions? `<div style="margin-top:8px"><b style="color:var(--ink);font-size:.9rem">${t('note_decisions')}</b>${n.decisions.map(d=>`<div class="intervention"><span style="color:var(--teal);margin-top:2px">${icon('check','sm')}</span><div class="tx">${esc(d)}</div></div>`).join('')}${n.planChanged? `<span class="badge medium" style="margin-top:6px">${icon('clip','sm')} ${t('note_plan_changed')}</span>`:''}</div>`:''}
    </div>`).join('') : `<div class="empty">${icon('mic')}${t('none')}</div>`}
  </div>`;
}
function bindNotes(m){
  document.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    b.disabled = true; b.innerHTML = icon('sparkle','sm') + t('generating');
    setTimeout(() => {
      DB.notes.push({id:uid('n'), memberId:m.id, type:b.dataset.rec, date:daysAgo(0), status:'draft', author:null, source:'ai', content: aiDraftNote(m, b.dataset.rec==='call'?'call': b.dataset.rec==='ict'?'ict':'visit'), attendees: b.dataset.rec==='ict'? ['Maria Gonzalez, RN (care manager)'].concat((m.careTeam||[]).map(x=>`${x.name} (${I18N.en.roles[x.role]||x.role})`)) : undefined});
      save(); render();
    }, 1200);
  });
  const mn = document.getElementById('manualNote');
  if(mn) mn.onclick = () => {
    const v = prompt(t('manual_note'), ''); if(!v) return;
    DB.notes.push({id:uid('n'), memberId:m.id, type:'manual', date:daysAgo(0), status:'approved', author:currentUser().name, source:'manual', content:v});
    save(); render();
  };
  document.querySelectorAll('[data-approvenote]').forEach(b => b.onclick = () => {
    const n = DB.notes.find(x=>x.id===b.dataset.approvenote);
    const ta = document.querySelector(`[data-notetext="${n.id}"]`);
    if(ta) n.content = ta.value.replace(/^(DRAFT|BORRADOR)\s*—\s*/,'');
    n.status='approved'; n.author=currentUser().name;
    if(!m.lastContact || m.lastContact < daysAgo(0)) m.lastContact = daysAgo(0);
    save(); toast(t('note_approved')); render();
  });
  document.querySelectorAll('[data-delnote]').forEach(b => b.onclick = () => { if(!confirm(t('delete')+'?')) return; DB.notes = DB.notes.filter(x=>x.id!==b.dataset.delnote); save(); render(); });
}

function tabData(m){
  const fam = (title, rows) => `<div class="card"><div class="card-head"><h3>${title}</h3></div><div class="card-body"><dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></div>`;
  const en = DB.settings.lang==='en';
  return `<div class="sub" style="margin-bottom:16px;color:var(--muted)">${t('data_sub')}</div>
  <div class="grid cols-3">
    ${fam(en?'Demographics':'Demografía', [[t('dob'), `${new Date().getFullYear()-m.age}`],[t('language'), esc(m.lang)],[t('contact_pref'), esc(m.contactPref)],[t('caregiver'), esc(m.caregiver||t('none'))],[t('living'), esc(m.living)]])}
    ${fam('HRA – Risk', [['HRA', m.hra.done? `${t('hra_done')} · ${fmtDate(m.hra.date)}` : `${t('hra_due')} ${fmtDate(m.hra.due)}`],[en?'Risk score':'Score de riesgo', `${m.riskScore} / 100`],[t('risk'), t('risk_'+m.risk)],[en?'Comorbidities':'Comorbilidades', m.conditions.length]])}
    ${fam(en?'Utilization (12 m)':'Utilización (12 m)', [[t('er_visits'), m.util.er],[t('hosp_adm'), m.util.ip],[t('pcp_visits'), m.util.pcp]])}
    ${fam(en?'Claims & diagnoses':'Claims y diagnósticos', m.conditions.map((c,i)=>[`DX ${i+1}`, esc(c)]))}
    ${fam('SDOH', m.sdoh.length? m.sdoh.map((s,i)=>[`Z-code ${i+1}`, t('sdoh_labels.'+s)]) : [['—', t('none')]])}
    ${fam(en?'Quality (Stars / HEDIS)':'Calidad (Stars / HEDIS)', m.gaps.length? m.gaps.map((g,i)=>[`Gap ${i+1}`, t('gap_labels.'+g)]) : [['—', t('none')]])}
  </div>`;
}

function tabAlerts(m){
  const list = DB.alerts.filter(a=>a.memberId===m.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card">${list.length? list.map(a=>alertItem(a,true)).join('') : `<div class="empty">${icon('check')}${t('no_alerts')}</div>`}</div>`;
}
