}

/* ---------- Reports ---------- */
function vReports(){
  const withPlans = DB.members.filter(m=>DB.carePlans[m.id]);
  const gapCounts = {};
  DB.members.forEach(m=>m.gaps.forEach(g=>{ gapCounts[g]=(gapCounts[g]||0)+1; }));
  const total = DB.members.length;
  return `
  <div class="page-head"><div><h1>${t('rep_title')}</h1><div class="sub">${t('rep_sub')}</div></div>
    <div class="actions"><button class="btn secondary" id="printBtn">${icon('file','sm')}${t('rep_print')}</button></div></div>
  <div class="card" style="margin-bottom:18px;overflow-x:auto">
    <div class="card-head"><h2>${t('rep_caseload')}</h2><span style="font-size:.85rem;color:var(--muted)">${t('rep_caseload_sub')}</span></div>
    <table class="tbl"><thead><tr><th>${t('col_member')}</th><th>${t('col_risk')}</th><th>HRA</th><th>${t('col_plan')}</th><th>${t('col_alerts')}</th><th>${t('col_lastcontact')}</th></tr></thead><tbody>
    ${DB.members.slice().sort((a,b)=>({high:0,medium:1,low:2}[a.risk])-({high:0,medium:1,low:2}[b.risk])).map(m=>{
      const al = alertsFor(m.id).length;
      return `<tr class="rowlink" data-go="members/${m.id}/summary">
        <td><b style="color:var(--ink)">${esc(m.name)}</b></td><td>${riskBadge(m.risk)}</td>
        <td>${m.hra.done? `<span class="badge ok">${t('hra_done')}</span>` : `<span class="badge ${daysUntil(m.hra.due)<7?'high':'medium'}">${t('hra_due')} ${fmtDate(m.hra.due)}</span>`}</td>
        <td>${m.carePlan.status==='active'? `<span class="badge ok">${t('plan_active')}</span>` : `<span class="badge medium">${t('plan_draft')}</span>`}</td>
        <td>${al? `<span class="badge count">${al}</span>`:'—'}</td><td>${fmtDate(m.lastContact)}</td></tr>`;}).join('')}
    </tbody></table>
  </div>
  ${(()=>{ const g = {total:0, met:0, met_late:0, not_met:0, in_progress:0};
    withPlans.forEach(m=>DB.carePlans[m.id].problems.forEach(p=>{ g.total++; g[p.goalStatus||'in_progress']++; }));
    const pct = n => g.total? Math.round(n/g.total*100) : 0;
    return `<div class="card" style="margin-bottom:18px"><div class="card-head"><h2>${t('rep_goals')}</h2><span style="font-size:.85rem;color:var(--muted)">${t('rep_goals_sub')}</span></div>
    <div class="grid cols-4" style="padding:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div class="stat"><div class="num">${fmtNum(g.total)}</div><div class="lbl">${t('goals_total')}</div></div>
      <div class="stat"><div class="num ok">${fmtNum(g.met+g.met_late)} <span style="font-size:1rem;color:var(--muted)">· ${pct(g.met+g.met_late)}%</span></div><div class="lbl">${t('goals_completed')}</div></div>
      <div class="stat"><div class="num ok">${fmtNum(g.met)} <span style="font-size:1rem;color:var(--muted)">· ${pct(g.met)}%</span></div><div class="lbl">${t('goals_ontime')}</div></div>
      <div class="stat"><div class="num warn">${fmtNum(g.met_late)}</div><div class="lbl">${t('goals_late')}</div></div>
      <div class="stat"><div class="num crit">${fmtNum(g.not_met)} <span style="font-size:1rem;color:var(--muted)">· ${pct(g.not_met)}%</span></div><div class="lbl">${t('goals_notmet')}</div></div>
      <div class="stat"><div class="num">${fmtNum(g.in_progress)}</div><div class="lbl">${t('goals_open')}</div></div>
    </div></div>`; })()}
  <div class="card" style="margin-bottom:18px;overflow-x:auto">
    <div class="card-head"><h2>${t('rep_effectiveness')}</h2><span style="font-size:.85rem;color:var(--muted)">${t('rep_eff_sub')}</span></div>
    <table class="tbl"><thead><tr><th>${t('col_member')}</th><th>${t('col_risk')}</th><th>${t('col_goals')}</th><th>${t('goals_ontime')}</th><th>${t('goals_late')}</th><th>${t('goals_notmet')}</th><th>${t('goals_open')}</th><th style="min-width:200px">${t('col_interventions')}</th><th>${t('col_status')}</th><th>${t('col_updated')}</th></tr></thead><tbody>
    ${withPlans.map(m=>{ const p = DB.carePlans[m.id];
      const ints = p.problems.reduce((a,x)=>a+x.interventions.length,0);
      const done = p.problems.reduce((a,x)=>a+x.interventions.filter(i=>i.done).length,0);
      const pct = ints? Math.round(done/ints*100) : 0;
      const c = k => p.problems.filter(x=>(x.goalStatus||'in_progress')===k).length;
      return {m,p,ints,done,pct,met:c('met'),late:c('met_late'),nm:c('not_met'),ip:c('in_progress')};
    }).sort((a,b)=> b.nm-a.nm || a.pct-b.pct).map(({m,p,ints,done,pct,met,late,nm,ip})=>`<tr class="rowlink" data-go="members/${m.id}/plan">
        <td><b style="color:var(--ink)">${esc(m.name)}</b></td><td>${riskBadge(m.risk)}</td><td>${p.problems.length}</td>
        <td>${met? `<span class="badge ok">${met}</span>`:'—'}</td><td>${late? `<span class="badge medium">${late}</span>`:'—'}</td><td>${nm? `<span class="badge high">${nm}</span>`:'—'}</td><td>${ip||'—'}</td>
        <td><div style="display:flex;align-items:center;gap:10px"><div class="progress" style="flex:1"><i style="width:${pct}%"></i></div><b style="color:var(--ink);white-space:nowrap">${done}/${ints} · ${pct}%</b></div></td>
        <td>${p.status==='active'? `<span class="badge ok">${t('plan_active')}</span>` : `<span class="badge medium">${t('plan_draft')}</span>`}</td>
        <td>${fmtDate(p.updated)}</td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="grid" style="grid-template-columns:1fr">
    <div class="card" style="overflow-x:auto">
      <div class="card-head"><h2>${t('rep_cm_perf')}</h2><span style="font-size:.85rem;color:var(--muted)">${t('rep_cm_sub')}</span></div>
      <table class="tbl"><thead><tr><th>${t('col_cm')}</th><th>${t('col_members')}</th><th>${t('col_hra_over')}</th><th>${t('col_plan_over')}</th><th>${t('col_alerts_pend')}</th><th>${t('goals_completed')}</th><th>${t('goals_ontime')}</th><th>${t('goals_notmet')}</th><th>${t('col_last_ict')}</th></tr></thead><tbody>
      ${DB.teamStats.map(sx=>{ const u = DB.users.find(x=>x.id===sx.cmId); const mem = sx.cmId==='cm1'? DB.members.length : sx.members;
        return `<tr><td><b style="color:var(--ink)">${esc(u.name)}</b></td><td>${fmtNum(mem)}</td>
        <td>${sx.hraOver? `<span class="badge high">${sx.hraOver}</span>`:'<span class="badge ok">0</span>'}</td>
        <td>${sx.planOver? `<span class="badge medium">${sx.planOver}</span>`:'<span class="badge ok">0</span>'}</td>
        <td>${sx.alertsPend}</td><td>${fmtNum(sx.goalsCompleted)}</td><td>${fmtNum(sx.goalsOnTime)} <span style="color:var(--muted)">· ${Math.round(sx.goalsOnTime/sx.goalsCompleted*100)}%</span></td><td>${sx.goalsNotMet? `<span class="badge high">${fmtNum(sx.goalsNotMet)}</span>`:'—'}</td><td>${fmtDate(sx.lastIct)}</td></tr>`;}).join('')}
      </tbody></table>
    </div>
    <div class="card" style="overflow-x:auto">
      <div class="card-head"><h2>${t('rep_gaps')}</h2><span style="font-size:.85rem;color:var(--muted)">${t('rep_gaps_sub')}</span></div>
      <table class="tbl"><thead><tr><th>${t('col_gap')}</th><th>${t('col_affected')}</th><th>${t('col_pct')}</th></tr></thead><tbody>
      ${Object.entries(gapCounts).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<tr><td><b style="color:var(--ink)">${t('gap_labels.'+g)}</b></td><td>${n}</td>
        <td><div style="display:flex;align-items:center;gap:10px"><div class="progress" style="flex:1;min-width:46px"><i style="width:${Math.round(n/total*100)}%;background:var(--amber)"></i></div>${Math.round(n/total*100)}%</div></td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>
`;
}
function bindReports(){
  const b = document.getElementById('printBtn'); if(b) b.onclick = () => window.print();
  document.querySelectorAll('[data-go]').forEach(r => r.onclick = () => nav(r.dataset.go));
}

/* ---------- Resources ---------- */
function vResources(){
  const cats = ['housing','food','transport','behavioral','utilities','social'];
  return `
  <div class="page-head"><div><h1>${t('res_title')}</h1><div class="sub">${t('res_sub')}</div></div>
    <div class="actions"><button class="btn" id="addRes">${icon('plus','sm')}${t('add_resource')}</button></div></div>
  <div class="grid cols-2">
    ${DB.resources.map(r=>`<div class="card"><div class="card-head">
      <h3>${esc(r.name)}</h3><span class="badge neutral">${t('cat_'+r.category)}</span>
      <button class="iconbtn" style="width:38px;height:38px" data-editres="${r.id}" aria-label="${t('edit')}">${icon('edit','sm')}</button>
      <button class="iconbtn" style="width:38px;height:38px" data-delres="${r.id}" aria-label="${t('delete')}">${icon('trash','sm')}</button></div>
      <div class="card-body"><dl class="kv">
        <dt>${t('phone')}</dt><dd><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></dd>
        <dt>${t('col_contact')}</dt><dd>${esc(r.contact)}</dd>
        <dt>${t('col_criteria')}</dt><dd style="font-weight:500">${esc(r.criteria)}</dd>
        ${r.notes? `<dt>Notas</dt><dd style="font-weight:500">${esc(r.notes)}</dd>`:''}
      </dl></div></div>`).join('')}
  </div>`;
}
function resModal(r){
  const isNew = !r;
  r = r || {id:uid('r'), name:'', category:'housing', phone:'', contact:'', criteria:'', notes:''};
  showModal(`<h2>${isNew? t('add_resource') : t('edit')}</h2>`, `
    <div class="field"><label>${t('col_org')}</label><input id="r_name" value="${esc(r.name)}" required></div>
    <div class="grid cols-2">
      <div class="field"><label>${t('col_cat')}</label><select id="r_cat">${['housing','food','transport','behavioral','utilities','social'].map(c=>`<option value="${c}" ${r.category===c?'selected':''}>${t('cat_'+c)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('phone')}</label><input id="r_phone" value="${esc(r.phone)}"></div>
    </div>
    <div class="field"><label>${t('col_contact')}</label><input id="r_contact" value="${esc(r.contact)}"></div>
    <div class="field"><label>${t('col_criteria')}</label><textarea id="r_criteria">${esc(r.criteria)}</textarea></div>
  `, () => {
    r.name = document.getElementById('r_name').value.trim(); if(!r.name) return false;
    r.category = document.getElementById('r_cat').value; r.phone = document.getElementById('r_phone').value;
    r.contact = document.getElementById('r_contact').value; r.criteria = document.getElementById('r_criteria').value;
    if(isNew) DB.resources.push(r);
    save(); toast(t('saved')); return true;
  });
}
function bindResources(){
  const a = document.getElementById('addRes'); if(a) a.onclick = () => resModal(null);
  document.querySelectorAll('[data-editres]').forEach(b => b.onclick = () => resModal(DB.resources.find(r=>r.id===b.dataset.editres)));
  document.querySelectorAll('[data-delres]').forEach(b => b.onclick = () => { if(!confirm(t('delete')+'?')) return; DB.resources = DB.resources.filter(r=>r.id!==b.dataset.delres); save(); toast(t('deleted')); render(); });
}

/* ---------- Settings ---------- */
function vSettings(){
  const s = DB.settings;
  const critKeys = [['snp','crit_snp'],['preg','crit_preg'],['referral','crit_referral'],['hra','crit_hra']];
  return `
  <div class="page-head"><div><h1>${t('set_title')}</h1><div class="sub">${t('set_sub')}</div></div></div>
  <div class="grid cols-2">
  <div class="card"><div class="card-head"><h2>${t('set_appearance')}</h2></div><div class="card-body">
    <div class="setting-row"><div class="sl"><b>${t('set_theme')}</b></div>
      <select id="s_theme" style="min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit"><option value="light" ${s.theme==='light'?'selected':''}>${t('theme_light')}</option><option value="dark" ${s.theme==='dark'?'selected':''}>${t('theme_dark')}</option></select></div>
    <div class="setting-row"><div class="sl"><b>${t('set_lang')}</b></div>
      <select id="s_lang" style="min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit"><option value="en" ${s.lang==='en'?'selected':''}>English (US)</option><option value="es" ${s.lang==='es'?'selected':''}>Español (UY)</option></select></div>
    <div class="setting-row"><div class="sl"><b>${t('set_text')}</b><span>${t('set_text_hint')}</span></div>
      <input type="checkbox" id="s_big" ${s.bigText?'checked':''} style="width:26px;height:26px;accent-color:var(--teal)"></div>
  </div></div>
  <div class="card"><div class="card-head"><h2>${t('set_plan')}</h2></div><div class="card-body">
    <div class="setting-row"><div class="sl"><b>${t('set_plan_name')}</b></div>
      <input id="s_plan" value="${esc(s.planName)}" style="min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;width:260px"></div>
    <div class="setting-row"><div class="sl"><b>${t('set_sweep')}</b></div>
      <select id="s_sweep" style="min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit"><option value="nightly" ${s.sweep==='nightly'?'selected':''}>${t('sweep_nightly')}</option><option value="12h" ${s.sweep==='12h'?'selected':''}>${t('sweep_12h')}</option><option value="rt" ${s.sweep==='rt'?'selected':''}>${t('sweep_realtime')}</option></select></div>
    <div class="setting-row"><div class="sl"><b>${t('set_restrat')}</b><span>${t('restrat_value')}</span></div><span class="badge ok">${t('restrat_on')}</span></div>
    <div class="setting-row"><div class="sl"><b>${t('set_escalate')}</b></div>
      <select id="s_esc" style="min-height:44px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit"><option ${s.escalateH===24?'selected':''} value="24">24 ${t('hours')}</option><option ${s.escalateH===48?'selected':''} value="48">48 ${t('hours')}</option><option ${s.escalateH===72?'selected':''} value="72">72 ${t('hours')}</option></select></div>
  </div></div>
  <div class="card"><div class="card-head"><h2>${t('set_criteria')}</h2></div><div class="card-body">
    <div style="font-size:.86rem;color:var(--muted);margin-bottom:8px">${t('set_criteria_hint')}</div>
    ${critKeys.map(([k,lbl])=>`<div class="setting-row"><div class="sl"><b>${t(lbl)}</b></div><input type="checkbox" data-crit="${k}" ${s.criteria[k]?'checked':''} ${k==='snp'?'disabled':''} style="width:26px;height:26px;accent-color:var(--teal)"></div>`).join('')}
  </div></div>
  <div class="card"><div class="card-head"><h2>${t('set_data')}</h2></div><div class="card-body">
    <p style="font-size:.92rem;color:var(--muted);margin-bottom:14px">${t('demo_banner')}</p>
    <button class="btn danger" id="resetBtn">${icon('refresh','sm')}${t('reset_data')}</button>
  </div></div>
  </div>`;
}
function bindSettings(){
  const g = id => document.getElementById(id);
  g('s_theme').onchange = e => { DB.settings.theme = e.target.value; save(); applyTheme(); render(); };
  g('s_lang').onchange = e => { DB.settings.lang = e.target.value; save(); applyTheme(); render(); };
  g('s_big').onchange = e => { DB.settings.bigText = e.target.checked; save(); applyTheme(); };
  g('s_plan').onchange = e => { DB.settings.planName = e.target.value; save(); render(); };
  g('s_sweep').onchange = e => { DB.settings.sweep = e.target.value; save(); };
  g('s_esc').onchange = e => { DB.settings.escalateH = +e.target.value; save(); };
  document.querySelectorAll('[data-crit]').forEach(c => c.onchange = () => { DB.settings.criteria[c.dataset.crit] = c.checked; save(); });
  g('resetBtn').onclick = () => { if(!confirm(t('reset_confirm'))) return; const lang = DB.settings.lang, theme = DB.settings.theme; resetDB(); DB.settings.lang = lang; DB.settings.theme = theme; save(); applyTheme(); toast(t('reset_done')); nav('dashboard'); render(); };
}

/* =================== Modal =================== */
function showModal(headHTML, bodyHTML, onSave){
  const back = document.createElement('div'); back.className='modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">${headHTML}<button class="iconbtn" id="mClose" aria-label="${t('close')}">${icon('x','sm')}</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">${t('cancel')}</button><button class="btn" id="mSave">${icon('check','sm')}${t('save')}</button></div>
  </div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  back.querySelector('#mClose').onclick = close;
  back.querySelector('#mCancel').onclick = close;
  back.onclick = e => { if(e.target===back) close(); };
  back.querySelector('#mSave').onclick = () => { if(onSave()!==false){ close(); render(); } };
  const first = back.querySelector('input,select,textarea'); if(first) first.focus();
}

/* =================== Render =================== */
function render(){
  const r = route();
  const app = document.getElementById('app');
  let page = r[0] || (currentUser().role==='director' ? 'leadership' : 'dashboard');
  let inner, binder = null;
  if(page==='dashboard'){ inner = vDashboard(); binder = bindDashboard; }
  else if(page==='alerts'){ inner = vAlerts(r[1]); binder = bindAlertActions; }
  else if(page==='members' && r[1]==='f'){ inner = vMembers(r[2], r[3], r[4]); binder = bindMembers; }
  else if(page==='members' && r[1]){ const m = member(r[1]); inner = vMember(r[1], r[2]); binder = () => { bindAlertActions(); if(m){ bindPlan(m); bindNotes(m); } }; }
  else if(page==='members'){ inner = vMembers(); binder = bindMembers; }
  else if(page==='leadership'){ inner = vLeadership(); }
  else if(page==='reports'){ inner = vReports(); binder = bindReports; }
  else if(page==='resources'){ inner = vResources(); binder = bindResources; }
  else if(page==='settings'){ inner = vSettings(); binder = bindSettings; }
  else { inner = vDashboard(); binder = bindDashboard; page='dashboard'; }
  app.innerHTML = shell(page, inner);
  bindShell();
  if(binder) binder();
  window.scrollTo(0,0);
}

/* =================== Init =================== */
loadDB();
applyTheme();
if(!location.hash) location.hash = '#/dashboard';
render();
</script>
